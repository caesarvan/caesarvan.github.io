name: Life Hub validation

on:
  push:
    paths:
      - 'life-hub-demo/**'
      - '.github/workflows/life-hub-ci.yml'
  pull_request:
    paths:
      - 'life-hub-demo/**'
      - '.github/workflows/life-hub-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static dashboard and failure cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: life-hub-demo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate published files
        run: node validate.mjs
      - name: Test validator against invalid fixtures
        run: node --test validate.test.mjs
