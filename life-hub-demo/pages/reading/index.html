<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>阅读花园 · Life OS</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="./reading.css"><script type="module" src="./reading.js"></script></head><body class="reading-page"><main class="reading-main"><div class="reading-header"><div><span class="eyebrow">A QUIET CORNER FOR YOUR MIND</span><h1>让思绪，去远方。</h1><p>在书页之间，留一片安静的花园。</p></div><button class="primary-button" id="add-book">＋ 一本想读的书</button></div><div class="reading-toolbar"><div class="reading-tabs" role="group" aria-label="筛选阅读状态"><button class="active" data-filter="all" aria-pressed="true">全部书籍 <span id="book-count">3</span></button><button data-filter="reading" aria-pressed="false">正在读</button><button data-filter="wish" aria-pressed="false">想读</button></div><span>DEMO COLLECTION</span></div><div class="book-grid" id="book-grid"></div><div class="reading-quote"><span>“</span><div>阅读，是一次可以随时出发的旅行。<small>给喜欢的事，留一点不被打扰的时间。</small></div><span class="quote-star">✧</span></div><p class="reading-note">独立页签演示 · 书单为示例内容，新增书籍在当前页面会话中保留。</p></main><dialog id="book-dialog" aria-labelledby="book-dialog-title"><form id="book-form"><div class="dialog-head"><h2 id="book-dialog-title">下一本，想读什么？</h2><button class="icon-button" id="close-book-dialog" type="button" aria-label="关闭">×</button></div><label class="field-label" for="book-title">书名</label><input class="text-input" id="book-title" name="title" maxlength="40" required placeholder="写下让你好奇的书名"><label class="field-label" for="book-author">作者</label><input class="text-input" id="book-author" name="author" maxlength="30" placeholder="可以稍后再补"><div class="dialog-actions"><button class="primary-button" type="submit">加入想读</button></div></form></dialog></body></html>
